[workspace]
resolver = "2"
members = [
  "crates/market-intelligence-contracts",
  "crates/market-intelligence-core",
  "crates/market-intelligence-storage",
  "crates/market-intelligence-source-policy",
  "crates/market-intelligence-entity-resolution",
  "crates/market-intelligence-signals",
  "crates/market-intelligence-source-sdk",
  "crates/market-intelligence-mcp-transport",
  "services/market-intelligence-server",
  "services/market-intelligence-scheduler",
  "services/market-intelligence-worker",
  "services/market-intelligence-admin",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false
authors = ["Richard M. Hamilton"]
repository = "https://github.com/rhamenator/market-intelligence-mcp"

[workspace.dependencies]
# Deliberately minimal. `serde`/`serde_json` are kept because this system's
# wire format is JSON Schema across three repositories and three languages;
# hand-rolling a JSON parser would trade a well-audited, extremely widely
# used dependency for bespoke parsing code, which is a worse security
# trade-off, not a better one. Every other candidate dependency (`uuid`,
# `time`, `thiserror`) has been removed in favor of small hand-written
# replacements — see `market_intelligence_core::utc_timestamp` and the
# hand-written `Display`/`Error` impls in `market_intelligence_source_policy`
# and `market_intelligence_storage`.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
