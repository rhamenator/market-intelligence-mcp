[workspace]
resolver = "2"
members = [
  "crates/market-intelligence-contracts",
  "crates/market-intelligence-core",
  "crates/market-intelligence-storage",
  "crates/market-intelligence-source-policy",
  "crates/market-intelligence-entity-resolution",
  "crates/market-intelligence-signals",
  "crates/market-intelligence-source-sdk",
  "crates/market-intelligence-mcp-transport",
  "services/market-intelligence-server",
  "services/market-intelligence-scheduler",
  "services/market-intelligence-worker",
  "services/market-intelligence-admin",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
time = { version = "0.3", features = ["serde", "formatting", "parsing"] }
thiserror = "1"
